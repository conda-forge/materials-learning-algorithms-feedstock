schema_version: 1

context:
  name: materials-learning-algorithms
  version: "1.4.0"
  python_min: "3.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/mala-project/mala/archive/v${{ version }}.tar.gz
  sha256: ecc5bc41082a26e3e8bc2341da0c8948463455e007db0f43044f3ffdb645d0c3
  patches:
    - requirements.patch

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python 3.12.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - ase
    - mpmath
    - numpy >=2
    - optuna
    - scipy
    - pandas
    - tensorboard
    - pytorch
    - openpmd-api
    - scikit-spatial
    - tqdm
    - mendeleev >=1.0.0

tests:
  - python:
      imports:
        - mala
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Materials Learning Algorithms. A framework for machine learning materials properties from first-principles data.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/mala-project/mala

extra:
  recipe-maintainers:
    - jan-janssen
